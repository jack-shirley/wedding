  <meta charset="utf-8">

  <meta name="description" content="Celebrate the wedding of Kyra Rojas and Jack Shirley in Telluride, Colorado on August 4 and 5, 2027.">
  <title>Kyra & Jack | August 4 and 5, 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Italiana&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="monogram" aria-label="Home">K<span>✳︎</span>J</a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Toggle navigation">MENU <span>☰</span></button>
    <nav id="main-nav" aria-label="Main navigation">
      <a href="details.html">SCHEDULE</a><a href="travel.html">TRAVEL</a><a href="gallery.html">GALLERY</a><a href="registry.html">REGISTRY</a><a href="rsvp.html" class="nav-rsvp">RSVP</a>
    </nav>
  </header>
  <main>
    <section id="rsvp" class="rsvp section-pad">
      <span class="big-star">✳︎</span>
      <p class="overline">THE PLEASURE OF YOUR COMPANY</p>
      <h2>Kindly <i>RSVP.</i></h2>
      <p>Find your invitation below. One person can respond for everyone in their invited party.</p>
      <div class="rsvp-panel">
        <form id="lookup-form" class="rsvp-form">
          <label for="guest-name">FIRST AND LAST NAME</label>
          <div class="rsvp-search-row"><input id="guest-name" name="name" type="text" autocomplete="name" placeholder="Your full name" maxlength="100" required><button type="submit">FIND MY INVITATION</button></div>
        </form>
        <div id="rsvp-message" class="rsvp-message" role="status" aria-live="polite"></div>
        <div id="party-panel" hidden>
          <p class="overline">YOUR INVITATION</p>
          <h3 id="party-title"></h3>
          <p id="party-description"></p>
          <form id="response-form" class="rsvp-form">
            <div id="guest-responses"></div>
            <button type="submit" class="rsvp-submit">SAVE OUR RSVP</button>
          </form>
          <button id="lookup-again" type="button" class="rsvp-link">Search another name</button>
        </div>
      </div>
      <p class="script">With love, Kyra & Jack</p>
    </section>
  </main>
  <footer><span>K ✳︎ J</span><span>MADE BY JACK · 2027</span><a href="#">BACK TO TOP ↑</a></footer>
</body>
</html>
